version: '3.8'

services:
  # Backend API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: smartwaste-server-prod
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-4000}
      - DATABASE_URL=${DATABASE_URL:-postgres://user:password@db:5432/smartwaste}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://smartwaste.ke}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME:-SmartWaste Admin}
      - LOG_LEVEL=info
    volumes:
      - smartwaste-data:/app/data
    networks:
      - smartwaste-network
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      - db

  # Frontend Application
  client:
    build:
      context: ./client/vite-project
      dockerfile: Dockerfile
    container_name: smartwaste-client-prod
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=${API_URL:-https://api.smartwaste.ke}
      - PORT=3000
    networks:
      - smartwaste-network
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      - server

  # PostgreSQL Database (Optional - for production)
  db:
    image: postgres:16-alpine
    container_name: smartwaste-db
    environment:
      - POSTGRES_USER=${DB_USER:-smartwaste}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=smartwaste
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
    volumes:
      - smartwaste-db-data:/var/lib/postgresql/data
    networks:
      - smartwaste-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-smartwaste}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

networks:
  smartwaste-network:
    driver: bridge

volumes:
  smartwaste-data:
    driver: local
  smartwaste-db-data:
    driver: local
